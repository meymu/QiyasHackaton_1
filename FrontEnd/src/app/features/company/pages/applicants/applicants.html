<button  class="back-link" routerLink="/company/jobs">← Back </button>

<h1>Applicants @if (job) { for {{ job.title }} }</h1>

@if (applicants.length === 0) {
  <p class="empty">No applicants yet.</p>
} @else {
  <div class="grid">
    @for (a of applicants; track a.id) {
      <app-applicant-card [applicant]="a" />
    }
  </div>
}
