<h1>Welcome, {{ displayName }}</h1>

@if (jobs$ | async; as jobs) {
  <div class="stats">
    <div class="stat"><span>{{ jobs.length }}</span>Posted jobs</div>
  </div>

  <div class="links">
    <a routerLink="/company/post-job">+ Post a job</a>
    <a routerLink="/company/jobs">Manage jobs</a>
  </div>
}
