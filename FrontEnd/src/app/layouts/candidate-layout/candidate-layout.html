
<div class="candidate-layout">

  <aside class="sidebar">
    <h2 class="brand">SkillBridge</h2>

    <p class="menu-label">CANDIDATE MENU</p>

    <nav>
     
      <a routerLink="/candidate/dashboard"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }">
        🏠 Dashboard
      </a>

      <a routerLink="/candidate/jobs"
         routerLinkActive="active">
        💼 Job Listings
      </a>

      <a routerLink="/candidate/applications"
         routerLinkActive="active">
        📄 My Applications
      </a>

      <a routerLink="/candidate/profile"
         routerLinkActive="active">
        👤 My Profile
      </a>
    </nav>

    <a routerLink="/" class="logout-link">
      🚪 Logout
    </a>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

</div>
